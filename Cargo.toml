[package]
name = "mermaid-rs-renderer"
version = "0.3.0"
edition = "2024"
description = "Fast Mermaid diagram renderer in pure Rust - 23 diagram types, 100-1400x faster than mermaid-cli"
license = "MIT"
readme = "README.md"
repository = "https://github.com/1jehuang/mermaid-rs-renderer"
homepage = "https://github.com/1jehuang/mermaid-rs-renderer"
keywords = ["mermaid", "diagram", "svg", "renderer", "cli"]
categories = ["command-line-utilities", "visualization"]
exclude = [
    "node_modules/",
    "comparison/",
    "tmp/",
    "docs/benchmarks/",
    "docs/comparisons/",
    "docs/comparison_sources/",
    "docs/conformance-report/",
    "docs/diagrams/",
    "docs/examples/",
    "docs/layout-compare-report/",
    "docs/*.html",
    "docs/*.json",
    "docs/*.md",
    "scripts/",
    ".github/",
    "package.json",
    "package-lock.json",
    "Cargo.toml.orig",
    "*.orig",
    "*.bak",
    "*~",
    ".DS_Store",
    "*.png",
    "*.html",
]

[features]
default = ["cli", "png"]
# CLI support (adds clap dependency)
cli = ["dep:clap"]
# PNG output support (adds resvg/usvg dependencies)
png = ["dep:resvg", "dep:usvg"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.6.1", features = ["derive"], optional = true }
regex = "1.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
json5 = "1.3"
thiserror = "2.0"
once_cell = "1.21.4"
# default-features=false drops fs/memmap/fontconfig: no system-font enumeration,
# no on-disk cache, no fontconfig C-lib. Required for sandboxed iOS + clean
# cross-compile. The renderer ships its own embedded face (see embedded_font.rs).
fontdb = { version = "0.23", default-features = false, features = ["std"] }
ttf-parser = "0.25"
# default-features=false on resvg/usvg drops system-fonts/memmap-fonts (and resvg's
# raster-images), keeping only vector text rendering against the embedded fontdb.
resvg = { version = "0.47.0", optional = true, default-features = false, features = ["text"] }
usvg = { version = "0.47.0", optional = true, default-features = false, features = ["text"] }

[profile.release]
lto = true
codegen-units = 1

[dev-dependencies]
criterion = "0.8"

[[bench]]
name = "renderer"
harness = false

[[bin]]
name = "mmdr"
path = "src/main.rs"
required-features = ["cli"]
