# cbindgen configuration for the mermaid-ffi C ABI (PRD §4.3).
#
# Regenerate the committed header with:
#   cbindgen --config cbindgen.toml --crate mermaid-ffi --output include/mmdr.h
#   clang-format -i --style=file include/mmdr.h
#
# The clang-format pass is REQUIRED: cbindgen's raw output is not internally
# consistent in trailing-comment spacing, so the committed header is the
# clang-formatted form (governed by the repo `.clang-format`). The drift gate
# in CI runs BOTH steps and FAILS if the result differs from the committed
# header (the transparent-ABI header-drift gate) — so the binary and the header
# can never diverge. Use the SAME clang-format major version in CI to keep the
# normalization reproducible.

language = "C"
header = "/* mmdr.h — C ABI for mermaid-ffi. GENERATED by cbindgen; DO NOT EDIT. */"
include_guard = "MMDR_H"
pragma_once = false
autogen_warning = "/* WARNING: generated by cbindgen — edits are overwritten. Regenerate via cbindgen.toml. */"
documentation = true
documentation_style = "c99"
style = "type"
cpp_compat = true
usize_is_size_t = true

[export]
include = ["MmdrStatus", "MmdrResult", "MmdrOptions"]
# `mmdr_panic_probe` is a non-default, never-shipped test-only symbol (the
# `panic_probe` feature). cbindgen does not evaluate cfg gates, so exclude it
# explicitly — it must never appear in the committed C header.
exclude = ["mmdr_panic_probe"]

[enum]
prefix_with_name = true

[parse]
parse_deps = false
